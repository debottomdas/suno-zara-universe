<svg width="1800" height="520" viewBox="0 0 1800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102135"/>
      <stop offset="0.35" stop-color="#5C4050"/>
      <stop offset="0.68" stop-color="#C87361"/>
      <stop offset="1" stop-color="#F1B176"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8B5B58" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#102437" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(1400 142) rotate(90) scale(180)">
      <stop stop-color="#FFE0A1" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F9A66F" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F0A26E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#07131F" stop-opacity="0.88"/>
      <stop offset="0.45" stop-color="#07131F" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#07131F" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="smallBlur"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="1800" height="520" fill="url(#sky)"/>
  <rect width="1800" height="520" fill="url(#sun)"/>
  <path d="M0 332 C290 300 500 345 790 318 C1100 288 1380 306 1800 274 V520 H0 Z" fill="url(#water)"/>

