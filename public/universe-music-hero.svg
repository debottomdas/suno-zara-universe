    <path d="M166 261 C128 246 105 211 88 173"/>
    <path d="M159 273 C196 239 227 208 248 162"/>
    <path d="M128 343 C90 319 61 283 38 251"/>
    <path d="M177 340 C223 315 251 283 278 245"/>
