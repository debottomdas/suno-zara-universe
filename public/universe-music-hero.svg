    <circle cx="695" cy="238" r="2"/><circle cx="787" cy="205" r="2"/><circle cx="860" cy="242" r="2"/>
    <circle cx="914" cy="211" r="2"/><circle cx="1065" cy="202" r="2"/><circle cx="1090" cy="174" r="2"/>
    <circle cx="1210" cy="222" r="2"/><circle cx="1315" cy="207" r="2"/><circle cx="1440" cy="212" r="2"/>
