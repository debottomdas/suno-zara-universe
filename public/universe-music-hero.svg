    <rect x="731" y="205" width="28" height="121" rx="2" fill="#132434"/>
    <rect x="766" y="151" width="59" height="175" rx="3" fill="#172839"/>
    <rect x="836" y="198" width="41" height="128" rx="2" fill="#15283A"/>
    <rect x="889" y="165" width="37" height="161" rx="2" fill="#182D40"/>
    <rect x="940" y="214" width="55" height="112" rx="2" fill="#13273A"/>
